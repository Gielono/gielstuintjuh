# Introductie

Sommige hoezen worden legendarisch door de artiest zelf, andere door het ontwerp/ de ontwerper.
Andy Warhol liet met zijn banaanen kunstwerk voor The Velvet Underground zien hoe een ‘simpele’ illustratie mischien nog wel beroemder dan de muziek kan worden.

Goede coverart moet 2 dingen doen: de muziek aanvullen én de belangrijke informatie overbrengen. Een albumhoes is soms het eerste contact tussen luisteraar en artiest, het moet aandacht trekken en herkenbaar zijn.

In deze presentatie duik ik achter de hoes: welke iconische hoezen zijn er, wie maakte het ontwerp, en wat zijn mijn favorieten?
